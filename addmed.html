<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#4860b2">

    <title>MediMate</title>

    <style>

        /* =========================================================
           RESET
        ========================================================= */

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            color: #ffffff;

            background:
                linear-gradient(
                    180deg,
                    rgba(113, 145, 211, 0.08),
                    rgba(63, 94, 177, 0.20),
                    rgba(23, 43, 94, 0.34)
                ),
                url("./bgmain.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            overflow: hidden;
        }


        /* =========================================================
           APP
        ========================================================= */

        .app {
            width: 100%;
            max-width: 430px;
            height: 100dvh;

            margin: 0 auto;

            padding: 18px 18px 14px;

            display: flex;
            flex-direction: column;

            position: relative;

            overflow: hidden;
        }


        /* =========================================================
           AMBIENT LIGHT
        ========================================================= */

        .ambient-light {
            position: absolute;

            width: 170px;
            height: 170px;

            border-radius: 50%;

            background: rgba(135, 166, 255, 0.14);

            filter: blur(48px);

            pointer-events: none;

            animation: floatingLight 8s ease-in-out infinite;

            z-index: 0;
        }

        .light-one {
            top: 8%;
            left: -90px;
        }

        .light-two {
            right: -90px;
            bottom: 5%;

            width: 190px;
            height: 190px;

            animation-delay: -4s;
        }

        @keyframes floatingLight {

            0%,
            100% {
                transform: translate3d(0, 0, 0);
            }

            50% {
                transform: translate3d(18px, -16px, 0);
            }
        }


        /* =========================================================
           TOP BAR
        ========================================================= */

        .top-bar {
            width: 100%;

            display: flex;
            align-items: center;

            flex-shrink: 0;

            margin-bottom: 5px;

            position: relative;
            z-index: 10;
        }


        /* =========================================================
           BACK BUTTON
        ========================================================= */

        .back-btn {
            width: 45px;
            height: 45px;

            flex-shrink: 0;

            border: 1px solid rgba(255, 255, 255, 0.20);

            border-radius: 14px;

            background: rgba(28, 77, 200, 0.634);

            backdrop-filter: blur(9px);
            -webkit-backdrop-filter: blur(9px);

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease,
                border-color 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(57, 103, 218, 0.82);

            border-color: rgba(183, 201, 255, 0.65);

            box-shadow:
                0 8px 22px rgba(25, 62, 150, 0.30);

            transform: translateY(-2px);
        }

        .back-btn:active {
            transform: scale(0.90);
        }

        .back-btn svg {
            width: 21px;
            height: 21px;

            transition: transform 0.2s ease;
        }

        .back-btn:hover svg {
            transform: translateX(-2px);
        }


        /* =========================================================
           PAGE SUPPORTING TEXT
        ========================================================= */

        .page-title {
            flex: 1;

            text-align: center;

            padding-right: 45px;
        }

        .page-title p {
            font-size: 14px;

            font-weight: 400;

            font-family:
                "Franklin Gothic Medium",
                "Arial Narrow",
                Arial,
                sans-serif;

            font-style: italic;

            color:  rgba(28, 77, 200, 0.634);

            text-shadow:
                0 2px 10px rgba(17, 36, 176, 0.45);
        }


        /* =========================================================
           MAIN CONTENT
        ========================================================= */

        .medicine-content {
            flex: 1;

            min-height: 0;

            display: flex;
            flex-direction: column;

            position: relative;

            z-index: 2;

            overflow: hidden;
        }


        /* =========================================================
           MEDICINE IMAGE AREA
        ========================================================= */

        .medicine-visual {
            width: 100%;

            height: 170px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

            margin: 3px 0 7px;
        }


        /* =========================================================
           TRANSPARENT PNG
        ========================================================= */

        .medicine-image {
            width: 145px;
            height: 145px;

            object-fit: contain;

            /*
                IMPORTANT:
                This does NOT add a background to the PNG.
                The PNG's own alpha transparency is preserved.
            */

            background: transparent !important;

            border: 0 !important;
            outline: 0 !important;

            border-radius: 12px;

            display: block;

            filter:
                drop-shadow(
                    0 16px 20px rgba(0, 0, 0, 0.20)
                );

            opacity: 1;

            animation:
                medicineFloat 4.5s ease-in-out infinite;

            transition:
                opacity 0.22s ease,
                filter 0.25s ease;
        }

        .medicine-image:hover {
            filter:
                drop-shadow(
                    0 20px 25px rgba(0, 0, 0, 0.27)
                );
        }

        @keyframes medicineFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }


        /* =========================================================
           IMAGE ERROR STATE
        ========================================================= */

        .image-error {
            position: absolute;

            display: none;

            width: 145px;
            height: 145px;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 15px;

            border-radius: 20px;

            background: rgba(15, 29, 67, 0.30);

            border: 1px solid rgba(255, 255, 255, 0.12);

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            color: rgba(255, 255, 255, 0.70);

            font-size: 10px;
            line-height: 1.4;
        }

        .image-error.show {
            display: flex;
        }


        /* =========================================================
           IMAGE ARROWS
        ========================================================= */

        .image-arrow {
            position: absolute;

            width: 34px;
            height: 34px;

            border-radius: 50%;

            border: 1px solid rgba(255, 255, 255, 0.20);

            background: rgba(28, 77, 200, 0.634);

            backdrop-filter: blur(9px);
            -webkit-backdrop-filter: blur(9px);

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            z-index: 5;

            transition:
                transform 0.18s ease,
                background 0.18s ease,
                box-shadow 0.18s ease,
                border-color 0.18s ease;
        }

        .image-arrow:hover {
            background: rgba(64, 108, 221, 0.88);

            border-color: rgba(192, 207, 255, 0.75);

            box-shadow:
                0 7px 18px rgba(29, 65, 160, 0.30);

            transform: scale(1.08);
        }

        .image-arrow:active {
            transform: scale(0.87);
        }

        .image-arrow.left {
            left: 5px;
        }

        .image-arrow.right {
            right: 5px;
        }

        .image-arrow svg {
            width: 21px;
            height: 21px;
        }


        /* =========================================================
           IMAGE DOTS
        ========================================================= */

        .image-indicator {
            position: absolute;

            bottom: 0;

            left: 50%;

            transform: translateX(-50%);

            display: flex;

            align-items: center;

            gap: 5px;
        }

        .image-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.35);

            transition:
                width 0.22s ease,
                background 0.22s ease,
                transform 0.22s ease;
        }

        .image-dot.active {
            width: 17px;

            border-radius: 6px;

            background: rgba(255, 255, 255, 0.90);
        }


        /* =========================================================
           FORM GROUP
        ========================================================= */

        .form-group {
            width: 100%;

            margin-top: 10px;
            margin-bottom: 9px;

            flex-shrink: 0;
        }


        /* =========================================================
           LABELS
        ========================================================= */

        .input-label {
            display: block;

            font-size: 13px;

            font-weight: 650;

            color: rgba(248, 241, 241, 0.94);

            margin-bottom: 5px;

            letter-spacing: 0.05px;

            text-shadow:
                0 0 10px rgba(3, 8, 26, 0.956);
        }


        /* =========================================================
           INPUTS
        ========================================================= */

        .input-box {
            width: 100%;

            height: 44px;

            border-radius: 13px;

            border: 1px solid rgba(162, 166, 177, 0.269);

            background: rgba(11, 38, 108, 0.32);

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            color: white;

            outline: none;

            padding: 0 13px;

            font-family: inherit;

            font-size: 12px;

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.055);

            transition:
                border-color 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease,
                transform 0.2s ease;
        }

        .input-box:hover {
            border-color:
                rgba(177, 195, 255, 0.40);

            background:
                rgba(18, 48, 124, 0.38);
        }

        .input-box:focus {
            border-color:
                rgba(157, 181, 255, 0.78);

            background:
                rgba(16, 27, 55, 0.42);

            box-shadow:
                0 0 0 3px rgba(107, 139, 230, 0.13),
                0 7px 20px rgba(15, 37, 100, 0.15);
        }

        .input-box::placeholder {
            color:
                rgba(255, 255, 255, 0.55);
        }

        textarea.input-box {
            height: 45px;

            padding-top: 11px;

            resize: none;
        }


        /* =========================================================
           DATE ROW
        ========================================================= */

        .date-row {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 10px;
        }

        input[type="date"] {
            color-scheme: dark;

            appearance: none;
            -webkit-appearance: none;
        }


        /* =========================================================
           FREQUENCY
        ========================================================= */

        .frequency-header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-bottom: 6px;
        }

        .frequency-label {
            font-size: 11px;

            font-weight: 650;

            color:
                rgba(255, 255, 255, 0.94);
        }

        .frequency-hint {
            font-size: 9px;

            color:
                rgba(255, 255, 255, 0.62);
        }

        .frequency-options {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 8px;

            margin-bottom: 8px;
        }

        .frequency-btn {
            height: 37px;

            border-radius: 11px;

            border:
                1px solid rgba(255, 255, 255, 0.15);

            background:
                rgba(16, 27, 55, 0.27);

            color:
                rgba(255, 255, 255, 0.84);

            font-family: inherit;

            font-size: 10px;

            font-weight: 650;

            cursor: pointer;

            transition:
                background 0.18s ease,
                border-color 0.18s ease,
                transform 0.18s ease,
                box-shadow 0.18s ease;
        }

        .frequency-btn:hover {
            background:
                rgba(67, 100, 190, 0.38);

            border-color:
                rgba(159, 182, 255, 0.52);

            transform: translateY(-2px);

            box-shadow:
                0 6px 16px rgba(29, 60, 145, 0.18);
        }

        .frequency-btn:active {
            transform: scale(0.95);
        }

        .frequency-btn.selected {
            color: white;

            background:
                rgba(91, 126, 235, 0.46);

            border-color:
                rgba(159, 182, 255, 0.82);

            box-shadow:
                0 5px 15px
                rgba(55, 88, 190, 0.16);
        }


        /* =========================================================
           TIME SLOTS
        ========================================================= */

        .time-slots {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 8px;

            width: 100%;
        }

        .time-slot {
            min-width: 0;

            animation: slotIn 0.22s ease both;
        }

        @keyframes slotIn {

            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .time-slot label {
            display: block;

            font-size: 9px;

            color:
                rgba(255, 255, 255, 0.76);

            margin-bottom: 4px;
        }

        .time-input {
            width: 100%;

            height: 42px;

            border-radius: 12px;

            border:
                1px solid rgba(255, 255, 255, 0.16);

            background:
                rgba(16, 27, 55, 0.32);

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            color: white;

            outline: none;

            padding: 0 6px;

            font-family: inherit;

            font-size: 10px;

            text-align: center;

            transition:
                border-color 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease,
                transform 0.2s ease;
        }

        .time-input:hover {
            border-color:
                rgba(159, 182, 255, 0.46);

            background:
                rgba(23, 43, 88, 0.38);
        }

        .time-input:focus {
            border-color:
                rgba(157, 181, 255, 0.78);

            background:
                rgba(16, 27, 55, 0.42);

            box-shadow:
                0 0 0 3px
                rgba(107, 139, 230, 0.13);
        }

        .time-input::placeholder {
            color:
                rgba(255, 255, 255, 0.50);
        }


        /* =========================================================
           MESSAGES
        ========================================================= */

        .error-message,
        .success-message {
            display: none;

            margin-top: 5px;

            padding: 8px 10px;

            border-radius: 10px;

            font-size: 9px;

            line-height: 1.3;

            flex-shrink: 0;
        }

        .error-message {
            background:
                rgba(255, 70, 70, 0.14);

            border:
                1px solid rgba(255, 110, 110, 0.25);

            color:
                #ffd0d0;
        }

        .success-message {
            background:
                rgba(70, 210, 140, 0.14);

            border:
                1px solid rgba(90, 220, 150, 0.25);

            color:
                #c5f8dc;

            text-align: center;
        }

        .error-message.show,
        .success-message.show {
            display: block;

            animation:
                messageIn 0.25s ease;
        }

        @keyframes messageIn {

            from {
                opacity: 0;

                transform:
                    translateY(5px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* =========================================================
           SAVE BUTTON
        ========================================================= */

        .save-btn {
            width: 100%;

            height: 48px;

            margin-top: 9px;

            border: none;

            border-radius: 14px;

            color: white;

            font-family: inherit;

            font-size: 12px;

            font-weight: 750;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #718fe9,
                    #4d66b8
                );

            box-shadow:
                0 10px 22px
                rgba(60, 88, 180, 0.28);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                opacity 0.2s ease,
                filter 0.2s ease;

            flex-shrink: 0;
        }

        .save-btn:hover {
            filter: brightness(1.10);

            transform:
                translateY(-2px);

            box-shadow:
                0 14px 28px
                rgba(60, 88, 180, 0.38);
        }

        .save-btn:active {
            transform:
                translateY(1px) scale(0.97);

            box-shadow:
                0 6px 13px
                rgba(60, 88, 180, 0.25);
        }

        .save-btn:disabled {
            cursor: default;

            opacity: 0.92;

            filter: none;

            transform: none;
        }

        .save-content {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 7px;
        }

        .save-content svg {
            width: 17px;
            height: 17px;

            transition:
                transform 0.2s ease;
        }

        .save-btn:hover .save-content svg {
            transform: scale(1.10);
        }


        /* =========================================================
           SMALL PHONES
        ========================================================= */

        @media (max-height: 720px) {

            .app {
                padding-top: 10px;
                padding-bottom: 10px;
            }

            .back-btn {
                width: 41px;
                height: 41px;
            }

            .medicine-visual {
                height: 145px;

                margin-bottom: 4px;
            }

            .medicine-image {
                width: 125px;
                height: 125px;
            }

            .image-error {
                width: 125px;
                height: 125px;
            }

            .form-group {
                margin-bottom: 6px;
            }

            .input-box {
                height: 40px;
            }

            textarea.input-box {
                height: 41px;
            }

            .frequency-btn {
                height: 34px;
            }

            .time-input {
                height: 38px;
            }

            .save-btn {
                height: 44px;
            }
        }


        /* =========================================================
           VERY SMALL WIDTH
        ========================================================= */

        @media (max-width: 360px) {

            .app {
                padding-left: 13px;
                padding-right: 13px;
            }

            .medicine-image {
                width: 122px;
                height: 122px;
            }

            .image-error {
                width: 122px;
                height: 122px;
            }

            .image-arrow {
                width: 40px;
                height: 40px;
            }

            .input-box {
                font-size: 11px;
            }

            .time-input {
                font-size: 9px;
            }
        }


        /* =========================================================
           REDUCE MOTION
        ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

    </style>
</head>


<body>

    <!-- =========================================================
         AMBIENT BACKGROUND
    ========================================================= -->

    <div class="ambient-light light-one"></div>
    <div class="ambient-light light-two"></div>


    <main class="app">

        <!-- =====================================================
             HEADER
        ====================================================== -->

        <header class="top-bar">

            <button
                class="back-btn"
                type="button"
                onclick="goBack()"
                aria-label="Go back">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round">

                    <path d="M19 12H5"></path>
                    <path d="M12 19l-7-7 7-7"></path>

                </svg>

            </button>


            <div class="page-title">

                <p>
                    Keep your medication on track!!!
                </p>

            </div>

        </header>


        <!-- =====================================================
             MAIN
        ====================================================== -->

        <section class="medicine-content">


            <!-- =================================================
                 MEDICINE IMAGE
            ================================================== -->

            <div class="medicine-visual">


                <!-- PREVIOUS -->

                <button
                    class="image-arrow left"
                    type="button"
                    onclick="previousMedicine()"
                    aria-label="Previous medicine">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <path d="M15 18l-6-6 6-6"></path>

                    </svg>

                </button>


                <!-- TRANSPARENT PNG -->

                <img
                    id="mainMedicineImage"
                    class="medicine-image"
                    src="./med1.png"
                    alt="Medicine"
                    draggable="false">


                <!-- IMAGE ERROR -->

                <div
                    id="imageError"
                    class="image-error">

                    Medicine image could not be loaded.

                </div>


                <!-- NEXT -->

                <button
                    class="image-arrow right"
                    type="button"
                    onclick="nextMedicine()"
                    aria-label="Next medicine">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <path d="M9 18l6-6-6-6"></path>

                    </svg>

                </button>


                <!-- DOTS -->

                <div
                    class="image-indicator"
                    id="imageIndicator">

                    <span class="image-dot active"></span>
                    <span class="image-dot"></span>
                    <span class="image-dot"></span>
                    <span class="image-dot"></span>

                </div>

            </div>


            <!-- =================================================
                 MEDICINE NAME
            ================================================== -->

            <div class="form-group">

                <label
                    class="input-label"
                    for="medicineName">

                    Medicine name

                </label>

                <input
                    id="medicineName"
                    class="input-box"
                    type="text"
                    placeholder="e.g. Paracetamol"
                    autocomplete="off">

            </div>


            <!-- =================================================
                 PERSON TAKING MEDICINE
            ================================================== -->

            <div class="form-group">

                <label
                    class="input-label"
                    for="personName">

                    Person taking medicine

                </label>

                <input
                    id="personName"
                    class="input-box"
                    type="text"
                    placeholder="e.g. Dad, Mom, Myself"
                    autocomplete="off">

            </div>


            <!-- =================================================
                 NOTE
            ================================================== -->

            <div class="form-group">

                <label
                    class="input-label"
                    for="medicineNote">

                    Add a note

                </label>

                <textarea
                    id="medicineNote"
                    class="input-box"
                    placeholder="e.g. Take after food"></textarea>

            </div>


            <!-- =================================================
                 MEDICATION PERIOD
            ================================================== -->

            <div class="form-group">

                <label class="input-label">

                    Medication period

                </label>


                <div class="date-row">

                    <div>

                        <label
                            class="input-label"
                            for="startDate">

                            Start date

                        </label>

                        <input
                            id="startDate"
                            class="input-box"
                            type="date">

                    </div>


                    <div>

                        <label
                            class="input-label"
                            for="endDate">

                            End date

                        </label>

                        <input
                            id="endDate"
                            class="input-box"
                            type="date">

                    </div>

                </div>

            </div>


            <!-- =================================================
                 FREQUENCY
            ================================================== -->

            <div class="form-group">

                <div class="frequency-header">

                    <span class="frequency-label">
                        How many times a day?
                    </span>

                    <span class="frequency-hint">
                        Select schedule
                    </span>

                </div>


                <div class="frequency-options">

                    <button
                        type="button"
                        class="frequency-btn selected"
                        data-times="1">

                        1 time

                    </button>


                    <button
                        type="button"
                        class="frequency-btn"
                        data-times="2">

                        2 times

                    </button>


                    <button
                        type="button"
                        class="frequency-btn"
                        data-times="3">

                        3 times

                    </button>

                </div>


                <div
                    id="timeSlots"
                    class="time-slots">
                </div>

            </div>


            <!-- =================================================
                 ERROR
            ================================================== -->

            <div
                id="errorMessage"
                class="error-message">

                Please fill in the required details.

            </div>


            <!-- =================================================
                 SUCCESS
            ================================================== -->

            <div
                id="successMessage"
                class="success-message">

                Medicine added successfully.

            </div>


            <!-- =================================================
                 SAVE
            ================================================== -->

            <button
                id="saveMedicineBtn"
                class="save-btn"
                type="button">

                <span class="save-content">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <path d="M12 5v14"></path>
                        <path d="M5 12h14"></path>

                    </svg>

                    Add Medicine

                </span>

            </button>

        </section>

    </main>


    <script>

        /* =========================================================
           ELEMENTS
        ========================================================= */

        const mainMedicineImage =
            document.getElementById("mainMedicineImage");

        const imageError =
            document.getElementById("imageError");

        const medicineName =
            document.getElementById("medicineName");

        const personName =
            document.getElementById("personName");

        const medicineNote =
            document.getElementById("medicineNote");

        const startDate =
            document.getElementById("startDate");

        const endDate =
            document.getElementById("endDate");

        const timeSlots =
            document.getElementById("timeSlots");

        const frequencyButtons =
            document.querySelectorAll(".frequency-btn");

        const saveMedicineBtn =
            document.getElementById("saveMedicineBtn");

        const errorMessage =
            document.getElementById("errorMessage");

        const successMessage =
            document.getElementById("successMessage");

        const imageDots =
            document.querySelectorAll(".image-dot");


        /* =========================================================
           MEDICINE IMAGES
           
           IMPORTANT:
           These files must be in the SAME folder as addmed.html:

               addmed.html
               med1.png
               med2.png
               med3.png
               med4.png
        ========================================================= */

        const medicineImages = [
            "./med1.png",
            "./med2.png",
            "./med3.png",
            "./med4.png"
        ];

        let currentImageIndex = 0;


        /* =========================================================
           IMAGE LOADING
        ========================================================= */

        function loadMedicineImage(index) {

            const imagePath =
                medicineImages[index];

            imageError.classList.remove("show");

            mainMedicineImage.style.opacity = "0";


            const testImage =
                new Image();


            testImage.onload = function () {

                mainMedicineImage.src =
                    imagePath;

                mainMedicineImage.style.opacity =
                    "1";

                imageError.classList.remove(
                    "show"
                );

            };


            testImage.onerror = function () {

                mainMedicineImage.style.opacity =
                    "0";

                imageError.classList.add(
                    "show"
                );

                console.error(
                    "MediMate image could not load:",
                    imagePath
                );

            };


            testImage.src =
                imagePath;
        }


        /* =========================================================
           UPDATE IMAGE
        ========================================================= */

        function updateMedicineImage() {

            imageDots.forEach(
                (dot, index) => {

                    dot.classList.toggle(
                        "active",
                        index === currentImageIndex
                    );

                }
            );


            loadMedicineImage(
                currentImageIndex
            );
        }


        /* =========================================================
           NEXT
        ========================================================= */

        function nextMedicine() {

            currentImageIndex++;

            if (
                currentImageIndex >=
                medicineImages.length
            ) {

                currentImageIndex = 0;

            }

            updateMedicineImage();
        }


        /* =========================================================
           PREVIOUS
        ========================================================= */

        function previousMedicine() {

            currentImageIndex--;

            if (
                currentImageIndex < 0
            ) {

                currentImageIndex =
                    medicineImages.length - 1;

            }

            updateMedicineImage();
        }


        /* =========================================================
           IMAGE PRELOAD
        ========================================================= */

        medicineImages.forEach(
            imagePath => {

                const image =
                    new Image();

                image.src =
                    imagePath;

            }
        );


        /* =========================================================
           TODAY
        ========================================================= */

        function getToday() {

            const today =
                new Date();

            const year =
                today.getFullYear();

            const month =
                String(
                    today.getMonth() + 1
                ).padStart(2, "0");

            const day =
                String(
                    today.getDate()
                ).padStart(2, "0");

            return `${year}-${month}-${day}`;
        }


        const today =
            getToday();


        /* =========================================================
           DEFAULT DATES
        ========================================================= */

        startDate.min =
            today;

        endDate.min =
            today;

        startDate.value =
            today;

        endDate.value =
            today;


        /* =========================================================
           CURRENT TIME
        ========================================================= */

        function getCurrentTime() {

            const now =
                new Date();

            let hours =
                now.getHours();

            const minutes =
                String(
                    now.getMinutes()
                ).padStart(2, "0");

            const ampm =
                hours >= 12
                    ? "PM"
                    : "AM";

            hours =
                hours % 12 || 12;

            return `${hours}:${minutes} ${ampm}`;
        }


        /* =========================================================
           CONVERT 12-HOUR TO 24-HOUR FORMAT
        ========================================================= */

        function convertTo24Hour(timeStr) {
            const time = timeStr.trim();
            const match = time.match(/^(\d{1,2}):(\d{2})\s*(AM|PM|am|pm)?$/);

            if (!match) {
                return time; // Return as-is if format doesn't match
            }

            let hours = parseInt(match[1], 10);
            const minutes = match[2];
            const period = match[3] ? match[3].toUpperCase() : "";

            if (period === "PM" && hours !== 12) {
                hours += 12;
            } else if (period === "AM" && hours === 12) {
                hours = 0;
            }

            return `${String(hours).padStart(2, "0")}:${minutes}`;
        }


        /* =========================================================
           CREATE TIME SLOTS
        ========================================================= */

        function createTimeSlots(count) {

            timeSlots.innerHTML =
                "";


            for (
                let i = 1;
                i <= count;
                i++
            ) {

                const slot =
                    document.createElement(
                        "div"
                    );

                slot.className =
                    "time-slot";


                let placeholder =
                    "8:00 AM";


                if (i === 2) {

                    placeholder =
                        "2:00 PM";

                }


                if (i === 3) {

                    placeholder =
                        "9:00 PM";

                }


                slot.innerHTML = `

                    <label
                        for="medicineTime${i}">

                        Time ${i}

                    </label>

                    <input
                        id="medicineTime${i}"
                        class="time-input medicine-time"
                        type="text"
                        placeholder="${placeholder}"
                        autocomplete="off">

                `;


                timeSlots.appendChild(
                    slot
                );
            }


            const firstTime =
                document.getElementById(
                    "medicineTime1"
                );


            if (firstTime) {

                firstTime.value =
                    getCurrentTime();

            }
        }


        /* =========================================================
           INITIAL TIME SLOT
        ========================================================= */

        createTimeSlots(1);


        /* =========================================================
           INITIAL IMAGE
        ========================================================= */

        loadMedicineImage(0);


        /* =========================================================
           FREQUENCY BUTTONS
        ========================================================= */

        frequencyButtons.forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        frequencyButtons.forEach(
                            item => {

                                item.classList.remove(
                                    "selected"
                                );

                            }
                        );


                        button.classList.add(
                            "selected"
                        );


                        const count =
                            Number(
                                button.dataset.times
                            );


                        createTimeSlots(
                            count
                        );


                        hideMessages();

                    }
                );

            }
        );


        /* =========================================================
           START DATE
        ========================================================= */

        startDate.addEventListener(
            "change",
            () => {

                if (!startDate.value) {
                    return;
                }


                endDate.min =
                    startDate.value;


                if (
                    !endDate.value ||
                    endDate.value <
                    startDate.value
                ) {

                    endDate.value =
                        startDate.value;

                }


                hideMessages();

            }
        );


        /* =========================================================
           END DATE
        ========================================================= */

        endDate.addEventListener(
            "change",
            () => {

                if (
                    startDate.value &&
                    endDate.value <
                    startDate.value
                ) {

                    endDate.value =
                        startDate.value;

                }


                hideMessages();

            }
        );


        /* =========================================================
           HIDE MESSAGES
        ========================================================= */

        function hideMessages() {

            errorMessage.classList.remove(
                "show"
            );

            successMessage.classList.remove(
                "show"
            );
        }


        [
            medicineName,
            personName,
            medicineNote,
            startDate,
            endDate
        ].forEach(
            input => {

                input.addEventListener(
                    "input",
                    hideMessages
                );

                input.addEventListener(
                    "change",
                    hideMessages
                );

            }
        );


        /* =========================================================
           SAVE
        ========================================================= */

        saveMedicineBtn.addEventListener(
            "click",
            saveMedicine
        );


        function saveMedicine() {

            hideMessages();


            const name =
                medicineName.value.trim();

            const person =
                personName.value.trim();

            const note =
                medicineNote.value.trim();

            const start =
                startDate.value;

            const end =
                endDate.value;


            /* =====================================================
               TIMES
            ===================================================== */

            const timeInputs =
                document.querySelectorAll(
                    ".medicine-time"
                );


            const times =
                Array.from(
                    timeInputs
                ).map(
                    input => ({
                        time: convertTo24Hour(input.value.trim()),
                        status: "pending"
                    })
                );


            /* =====================================================
               REQUIRED FIELDS
            ===================================================== */

            if (
                !name ||
                !person ||
                !start ||
                !end
            ) {

                errorMessage.textContent =
                    "Please fill in the medicine name, person, and dates.";

                errorMessage.classList.add(
                    "show"
                );

                return;
            }


            /* =====================================================
               TIME VALIDATION
            ===================================================== */

            if (
                times.some(
                    t => !t.time
                )
            ) {

                errorMessage.textContent =
                    "Please enter a time for every dose.";

                errorMessage.classList.add(
                    "show"
                );

                return;
            }


            /* =====================================================
               DATE VALIDATION
            ===================================================== */

            if (
                end < start
            ) {

                errorMessage.textContent =
                    "End date cannot be before the start date.";

                errorMessage.classList.add(
                    "show"
                );

                return;
            }


            /* =====================================================
               FREQUENCY
            ===================================================== */

            const selectedFrequency =
                document.querySelector(
                    ".frequency-btn.selected"
                );


            const frequency =
                selectedFrequency
                    ? Number(
                        selectedFrequency.dataset.times
                    )
                    : 1;


            /* =====================================================
               MEDICINE OBJECT
            ===================================================== */

            const medicine = {

                id:
                    Date.now(),

                name:
                    name,

                person:
                    person,

                note:
                    note,

                image:
                    medicineImages[
                        currentImageIndex
                    ],

                startDate:
                    start,

                endDate:
                    end,

                frequency:
                    frequency,

                times:
                    times,

                createdAt:
                    new Date().toISOString()

            };


            /* =====================================================
               EXISTING MEDICINES
            ===================================================== */

            let medicines = [];


            try {

                const stored =
                    localStorage.getItem(
                        "medicines"
                    );


                medicines =
                    stored
                        ? JSON.parse(stored)
                        : [];


                if (
                    !Array.isArray(
                        medicines
                    )
                ) {

                    medicines = [];

                }

            } catch (error) {

                console.error(
                    "Could not read medicines:",
                    error
                );

                medicines = [];

            }


            /* =====================================================
               ADD
            ===================================================== */

            medicines.push(
                medicine
            );


            /* =====================================================
               SAVE
            ===================================================== */

            try {

                localStorage.setItem(
                    "medicines",
                    JSON.stringify(
                        medicines
                    )
                );

            } catch (error) {

                errorMessage.textContent =
                    "Could not save the medicine on this device.";

                errorMessage.classList.add(
                    "show"
                );

                console.error(
                    "LocalStorage error:",
                    error
                );

                return;
            }


            /* =====================================================
               SUCCESS
            ===================================================== */

            successMessage.textContent =
                `${name} has been added successfully.`;

            successMessage.classList.add(
                "show"
            );


            /* =====================================================
               BUTTON SUCCESS STATE
            ===================================================== */

            saveMedicineBtn.innerHTML = `

                <span class="save-content">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <path
                            d="M20 6L9 17l-5-5">
                        </path>

                    </svg>

                    Medicine Added

                </span>

            `;


            saveMedicineBtn.disabled =
                true;


            /* =====================================================
               RETURN HOME
            ===================================================== */

            setTimeout(
                () => {

                    window.location.href =
                        "./index.html";

                },
                800
            );
        }


        /* =========================================================
           BACK BUTTON
        ========================================================= */

        function goBack() {

            if (
                document.referrer &&
                document.referrer !==
                window.location.href
            ) {

                history.back();

            } else {

                window.location.href =
                    "./index.html";

            }
        }

    </script>

</body>

</html>
