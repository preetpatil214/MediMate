<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#4860b2">

    <title>Add Medicine | MediMate</title>

    <style>
        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* =========================================
           BODY
        ========================================= */

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            color: #ffffff;

            background:
                linear-gradient(
                    180deg,
                    rgba(145, 166, 205, 0.25),
                    rgba(62, 94, 175, 0.35),
                    rgba(18, 38, 91, 0.70)
                ),
                url("bgmain.jpg");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            overflow: hidden;
        }

        /* =========================================
           APP
        ========================================= */

        .app {
            width: 100%;
            max-width: 430px;
            height: 100dvh;

            margin: 0 auto;

            padding: 14px 16px;

            position: relative;

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }

        /* =========================================
           TOP BAR
        ========================================= */

        .top-bar {
            width: 100%;

            display: flex;
            align-items: center;

            flex-shrink: 0;

            margin-bottom: 7px;
        }

        .back-btn {
            width: 40px;
            height: 40px;

            flex-shrink: 0;

            border: 1px solid rgba(255, 255, 255, 0.18);

            border-radius: 14px;

            background: rgba(255, 255, 255, 0.10);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.16);
            transform: translateX(-2px);
        }

        .back-btn:active {
            transform: scale(0.92);
        }

        .back-btn svg {
            width: 18px;
            height: 18px;
        }

        .page-title {
            flex: 1;
            text-align: center;
            padding-right: 40px;
        }

        .page-title h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.4px;
        }

        .page-title p {
            margin-top: 2px;

            font-size: 10px;

            color: rgba(255, 255, 255, 0.65);

            letter-spacing: 0.2px;
        }

        /* =========================================
           MAIN CONTENT
           
           NO BIG GLASS CARD
        ========================================= */

        .medicine-card {
            width: 100%;

            flex: 1;
            min-height: 0;

            padding: 0;

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }

        /* =========================================
           MEDICINE IMAGE
        ========================================= */

        .image-preview-area {
            height: 82px;

            display: flex;
            justify-content: center;
            align-items: center;

            flex-shrink: 0;

            margin-bottom: 6px;
        }

        .main-medicine-image {
            width: 76px;
            height: 76px;

            object-fit: contain;

            /* IMPORTANT FOR TRANSPARENT PNG */
            background: transparent;

            border: none;

            padding: 0;

            filter:
                drop-shadow(
                    0 10px 15px rgba(0, 0, 0, 0.20)
                );

            transition:
                transform 0.25s ease,
                filter 0.25s ease;
        }

        .main-medicine-image:hover {
            transform: translateY(-2px) scale(1.03);

            filter:
                drop-shadow(
                    0 14px 20px rgba(0, 0, 0, 0.24)
                );
        }

        /* =========================================
           SECTION LABEL
        ========================================= */

        .section-label {
            font-size: 10px;

            color: rgba(255, 255, 255, 0.78);

            margin-bottom: 5px;

            font-weight: 600;

            letter-spacing: 0.2px;
        }

        /* =========================================
           MEDICINE OPTIONS
        ========================================= */

        .medicine-options {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 7px;

            margin-bottom: 8px;

            flex-shrink: 0;
        }

        .medicine-option {
            height: 44px;

            border-radius: 13px;

            background:
                rgba(255, 255, 255, 0.10);

            border:
                1px solid rgba(255, 255, 255, 0.13);

            display: flex;

            align-items: center;
            justify-content: center;

            cursor: pointer;

            transition:
                transform 0.18s ease,
                background 0.18s ease,
                border 0.18s ease,
                box-shadow 0.18s ease;

            overflow: hidden;
        }

        .medicine-option:hover {
            background:
                rgba(255, 255, 255, 0.15);

            transform:
                translateY(-1px);
        }

        .medicine-option:active {
            transform: scale(0.94);
        }

        .medicine-option img {
            width: 34px;
            height: 34px;

            object-fit: contain;

            background: transparent;

            border: none;

            filter:
                drop-shadow(
                    0 4px 6px rgba(0, 0, 0, 0.16)
                );

            transition:
                transform 0.2s ease;
        }

        .medicine-option.selected {
            background:
                rgba(91, 126, 235, 0.32);

            border:
                1px solid rgba(143, 169, 255, 0.85);

            box-shadow:
                0 0 0 2px
                rgba(88, 121, 226, 0.15);
        }

        .medicine-option.selected img {
            transform: scale(1.08);
        }

        /* =========================================
           FORM
        ========================================= */

        .form-group {
            margin-bottom: 7px;

            flex-shrink: 0;
        }

        .input-label {
            display: block;

            font-size: 9px;

            font-weight: 600;

            color:
                rgba(255, 255, 255, 0.76);

            margin-bottom: 4px;

            letter-spacing: 0.15px;
        }

        .input-box {
            width: 100%;

            height: 37px;

            border-radius: 12px;

            border:
                1px solid rgba(255, 255, 255, 0.14);

            background:
                rgba(255, 255, 255, 0.11);

            color: white;

            outline: none;

            padding:
                0 11px;

            font-size: 11px;

            transition:
                border 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        .input-box::placeholder {
            color:
                rgba(255, 255, 255, 0.46);
        }

        .input-box:focus {
            border-color:
                rgba(140, 168, 255, 0.85);

            background:
                rgba(255, 255, 255, 0.15);

            box-shadow:
                0 0 0 3px
                rgba(94, 126, 225, 0.13);
        }

        textarea.input-box {
            height: 38px;

            padding-top: 10px;

            resize: none;

            font-family: inherit;
        }

        /* =========================================
           DATE ROW
        ========================================= */

        .date-row {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 8px;
        }

        .date-field {
            position: relative;
        }

        input[type="date"] {
            color-scheme: dark;

            appearance: none;
            -webkit-appearance: none;
        }

        /* =========================================
           FREQUENCY
        ========================================= */

        .frequency-header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 4px;
        }

        .frequency-label {
            font-size: 9px;

            font-weight: 600;

            color:
                rgba(255, 255, 255, 0.78);
        }

        .frequency-hint {
            font-size: 8px;

            color:
                rgba(255, 255, 255, 0.55);
        }

        .frequency-options {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 7px;

            margin-bottom: 6px;
        }

        .frequency-btn {
            height: 31px;

            border-radius: 10px;

            border:
                1px solid rgba(255, 255, 255, 0.13);

            background:
                rgba(255, 255, 255, 0.09);

            color:
                rgba(255, 255, 255, 0.76);

            font-size: 9px;

            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.18s ease,
                border 0.18s ease,
                transform 0.18s ease;
        }

        .frequency-btn:hover {
            background:
                rgba(255, 255, 255, 0.14);
        }

        .frequency-btn:active {
            transform: scale(0.96);
        }

        .frequency-btn.selected {
            color: white;

            background:
                rgba(91, 126, 235, 0.38);

            border-color:
                rgba(143, 169, 255, 0.85);

            box-shadow:
                0 5px 15px
                rgba(55, 88, 190, 0.15);
        }

        /* =========================================
           TIME SLOTS
        ========================================= */

        .time-slots {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 7px;
        }

        .time-slot {
            position: relative;
        }

        .time-slot label {
            display: block;

            font-size: 8px;

            color:
                rgba(255, 255, 255, 0.62);

            margin-bottom: 3px;
        }

        .time-input {
            width: 100%;

            height: 37px;

            border-radius: 11px;

            border:
                1px solid rgba(255, 255, 255, 0.14);

            background:
                rgba(255, 255, 255, 0.10);

            color: white;

            outline: none;

            padding:
                0 6px;

            font-family: inherit;

            font-size: 10px;

            text-align: center;

            transition:
                border 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        .time-input::placeholder {
            color:
                rgba(255, 255, 255, 0.40);
        }

        .time-input:focus {
            border-color:
                rgba(140, 168, 255, 0.85);

            background:
                rgba(255, 255, 255, 0.15);

            box-shadow:
                0 0 0 3px
                rgba(94, 126, 225, 0.13);
        }

        /* =========================================
           MESSAGES
        ========================================= */

        .error-message,
        .success-message {
            display: none;

            margin-top: 5px;

            padding:
                6px 8px;

            border-radius: 9px;

            font-size: 9px;

            line-height: 1.3;

            flex-shrink: 0;
        }

        .error-message {
            background:
                rgba(255, 82, 82, 0.14);

            border:
                1px solid rgba(255, 110, 110, 0.25);

            color:
                #ffb4b4;
        }

        .success-message {
            background:
                rgba(90, 220, 150, 0.13);

            border:
                1px solid rgba(90, 220, 150, 0.25);

            color:
                #a8f5c8;

            text-align: center;
        }

        .error-message.show,
        .success-message.show {
            display: block;

            animation:
                messageIn 0.25s ease;
        }

        /* =========================================
           SAVE BUTTON
        ========================================= */

        .save-btn {
            width: 100%;

            height: 40px;

            margin-top: 7px;

            border: none;

            border-radius: 12px;

            color: white;

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 0.1px;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #6684e8,
                    #4860b2
                );

            box-shadow:
                0 9px 20px
                rgba(60, 88, 180, 0.30);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                opacity 0.2s ease;

            flex-shrink: 0;
        }

        .save-btn:hover {
            transform:
                translateY(-1px);

            box-shadow:
                0 12px 24px
                rgba(60, 88, 180, 0.38);
        }

        .save-btn:active {
            transform:
                scale(0.97);
        }

        .save-btn:disabled {
            cursor: default;
            opacity: 0.9;
        }

        .save-content {
            display: flex;

            align-items: center;

            justify-content: center;

            gap: 6px;
        }

        .save-content svg {
            width: 14px;
            height: 14px;
        }

        /* =========================================
           ANIMATION
        ========================================= */

        @keyframes messageIn {
            from {
                opacity: 0;
                transform:
                    translateY(4px);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0);
            }
        }

        /* =========================================
           SMALL PHONES
        ========================================= */

        @media (max-height: 700px) {

            .app {
                padding-top: 8px;
                padding-bottom: 8px;
            }

            .top-bar {
                margin-bottom: 5px;
            }

            .back-btn {
                width: 36px;
                height: 36px;
            }

            .page-title h1 {
                font-size: 18px;
            }

            .page-title p {
                font-size: 9px;
            }

            .image-preview-area {
                height: 68px;
                margin-bottom: 4px;
            }

            .main-medicine-image {
                width: 63px;
                height: 63px;
            }

            .medicine-options {
                margin-bottom: 6px;
            }

            .medicine-option {
                height: 40px;
            }

            .medicine-option img {
                width: 31px;
                height: 31px;
            }

            .form-group {
                margin-bottom: 5px;
            }

            .input-box {
                height: 34px;
            }

            textarea.input-box {
                height: 35px;
            }

            .frequency-options {
                margin-bottom: 5px;
            }

            .frequency-btn {
                height: 29px;
            }

            .time-input {
                height: 34px;
            }

            .save-btn {
                height: 38px;
            }
        }

        /* =========================================
           VERY SMALL WIDTH
        ========================================= */

        @media (max-width: 360px) {

            .app {
                padding-left: 11px;
                padding-right: 11px;
            }

            .medicine-option {
                height: 40px;
            }

            .medicine-option img {
                width: 30px;
                height: 30px;
            }

            .time-input {
                font-size: 9px;
                padding: 0 4px;
            }
        }
    </style>
</head>


<body>

    <main class="app">

        <!-- =====================================
             HEADER
        ====================================== -->

        <header class="top-bar">

            <button
                class="back-btn"
                type="button"
                onclick="goBack()"
                aria-label="Go back">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round">

                    <path d="M19 12H5"></path>

                    <path d="M12 19l-7-7 7-7"></path>

                </svg>

            </button>


            <div class="page-title">

                <h1>Add Medicine</h1>

                <p>
                    Keep your medication on track
                </p>

            </div>

        </header>


        <!-- =====================================
             MEDICINE CONTENT
        ====================================== -->

        <section class="medicine-card">

            <!-- =================================
                 MAIN MEDICINE IMAGE
            ================================== -->

            <div class="image-preview-area">

                <img
                    id="mainMedicineImage"
                    class="main-medicine-image"
                    src="med1.png"
                    alt="Selected medicine">

            </div>


            <!-- =================================
                 CHOOSE MEDICINE
            ================================== -->

            <div class="section-label">
                Choose medicine
            </div>


            <div class="medicine-options">

                <button
                    class="medicine-option selected"
                    type="button"
                    data-image="med1.png"
                    aria-label="Medicine 1">

                    <img
                        src="med1.png"
                        alt="Medicine 1">

                </button>


                <button
                    class="medicine-option"
                    type="button"
                    data-image="med2.png"
                    aria-label="Medicine 2">

                    <img
                        src="med2.png"
                        alt="Medicine 2">

                </button>


                <button
                    class="medicine-option"
                    type="button"
                    data-image="med3.png"
                    aria-label="Medicine 3">

                    <img
                        src="med3.png"
                        alt="Medicine 3">

                </button>


                <button
                    class="medicine-option"
                    type="button"
                    data-image="med4.png"
                    aria-label="Medicine 4">

                    <img
                        src="med4.png"
                        alt="Medicine 4">

                </button>

            </div>


            <!-- =================================
                 MEDICINE NAME
            ================================== -->

            <div class="form-group">

                <label
                    class="input-label"
                    for="medicineName">

                    Medicine name

                </label>

                <input
                    id="medicineName"
                    class="input-box"
                    type="text"
                    placeholder="e.g. Paracetamol"
                    autocomplete="off">

            </div>


            <!-- =================================
                 NOTE
            ================================== -->

            <div class="form-group">

                <label
                    class="input-label"
                    for="medicineNote">

                    Add a note

                </label>

                <textarea
                    id="medicineNote"
                    class="input-box"
                    placeholder="e.g. Take after food"></textarea>

            </div>


            <!-- =================================
                 MEDICATION PERIOD
            ================================== -->

            <div class="form-group">

                <label class="input-label">
                    Medication period
                </label>


                <div class="date-row">

                    <div class="date-field">

                        <label
                            class="input-label"
                            for="startDate">

                            Start date

                        </label>

                        <input
                            id="startDate"
                            class="input-box"
                            type="date">

                    </div>


                    <div class="date-field">

                        <label
                            class="input-label"
                            for="endDate">

                            End date

                        </label>

                        <input
                            id="endDate"
                            class="input-box"
                            type="date">

                    </div>

                </div>

            </div>


            <!-- =================================
                 FREQUENCY
            ================================== -->

            <div class="form-group">

                <div class="frequency-header">

                    <span class="frequency-label">
                        How many times a day?
                    </span>

                    <span class="frequency-hint">
                        Select your schedule
                    </span>

                </div>


                <div class="frequency-options">

                    <button
                        type="button"
                        class="frequency-btn selected"
                        data-times="1">

                        1 time

                    </button>


                    <button
                        type="button"
                        class="frequency-btn"
                        data-times="2">

                        2 times

                    </button>


                    <button
                        type="button"
                        class="frequency-btn"
                        data-times="3">

                        3 times

                    </button>

                </div>


                <!-- DYNAMIC TIMES -->

                <div
                    id="timeSlots"
                    class="time-slots">

                </div>

            </div>


            <!-- =================================
                 ERROR
            ================================== -->

            <div
                id="errorMessage"
                class="error-message">

                Please fill in the required details.

            </div>


            <!-- =================================
                 SUCCESS
            ================================== -->

            <div
                id="successMessage"
                class="success-message">

                Medicine added successfully.

            </div>


            <!-- =================================
                 SAVE BUTTON
            ================================== -->

            <button
                id="saveMedicineBtn"
                class="save-btn"
                type="button">

                <span class="save-content">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <path d="M12 5v14"></path>

                        <path d="M5 12h14"></path>

                    </svg>

                    Add Medicine

                </span>

            </button>

        </section>

    </main>


    <script>

        /* =========================================
           ELEMENTS
        ========================================= */

        const mainMedicineImage =
            document.getElementById(
                "mainMedicineImage"
            );

        const medicineOptions =
            document.querySelectorAll(
                ".medicine-option"
            );

        const medicineName =
            document.getElementById(
                "medicineName"
            );

        const medicineNote =
            document.getElementById(
                "medicineNote"
            );

        const startDate =
            document.getElementById(
                "startDate"
            );

        const endDate =
            document.getElementById(
                "endDate"
            );

        const timeSlots =
            document.getElementById(
                "timeSlots"
            );

        const frequencyButtons =
            document.querySelectorAll(
                ".frequency-btn"
            );

        const saveMedicineBtn =
            document.getElementById(
                "saveMedicineBtn"
            );

        const errorMessage =
            document.getElementById(
                "errorMessage"
            );

        const successMessage =
            document.getElementById(
                "successMessage"
            );


        /* =========================================
           TODAY
        ========================================= */

        function getToday() {

            const today = new Date();

            const year =
                today.getFullYear();

            const month =
                String(
                    today.getMonth() + 1
                ).padStart(2, "0");

            const day =
                String(
                    today.getDate()
                ).padStart(2, "0");

            return `${year}-${month}-${day}`;
        }


        const today = getToday();


        /* =========================================
           DEFAULT DATES
        ========================================= */

        startDate.min = today;

        endDate.min = today;

        startDate.value = today;

        endDate.value = today;


        /* =========================================
           CURRENT TIME
        ========================================= */

        function getCurrentTime() {

            const now = new Date();

            let hours =
                now.getHours();

            const minutes =
                String(
                    now.getMinutes()
                ).padStart(2, "0");

            const ampm =
                hours >= 12
                    ? "PM"
                    : "AM";

            hours =
                hours % 12 || 12;

            return `${hours}:${minutes} ${ampm}`;
        }


        /* =========================================
           CREATE TIME SLOTS
        ========================================= */

        function createTimeSlots(count) {

            timeSlots.innerHTML = "";


            for (
                let i = 1;
                i <= count;
                i++
            ) {

                const slot =
                    document.createElement(
                        "div"
                    );

                slot.className =
                    "time-slot";


                let placeholder =
                    "8:00 AM";

                if (i === 2) {
                    placeholder =
                        "2:00 PM";
                }

                if (i === 3) {
                    placeholder =
                        "9:00 PM";
                }


                slot.innerHTML = `

                    <label
                        for="medicineTime${i}">

                        Time ${i}

                    </label>

                    <input
                        id="medicineTime${i}"
                        class="time-input medicine-time"
                        type="text"
                        placeholder="${placeholder}"
                        autocomplete="off">

                `;


                timeSlots.appendChild(
                    slot
                );
            }


            /*
             * Put current time in
             * first slot only.
             */

            const firstTime =
                document.getElementById(
                    "medicineTime1"
                );

            if (firstTime) {

                firstTime.value =
                    getCurrentTime();

            }
        }


        /* =========================================
           DEFAULT
        ========================================= */

        createTimeSlots(1);


        /* =========================================
           FREQUENCY BUTTONS
        ========================================= */

        frequencyButtons.forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        frequencyButtons.forEach(
                            item => {

                                item.classList.remove(
                                    "selected"
                                );

                            }
                        );


                        button.classList.add(
                            "selected"
                        );


                        const count =
                            Number(
                                button.dataset.times
                            );


                        createTimeSlots(
                            count
                        );


                        hideMessages();

                    }
                );

            }
        );


        /* =========================================
           MEDICINE IMAGE SELECTION
           
           ALL PNG
        ========================================= */

        medicineOptions.forEach(
            option => {

                option.addEventListener(
                    "click",
                    () => {

                        medicineOptions.forEach(
                            item => {

                                item.classList.remove(
                                    "selected"
                                );

                            }
                        );


                        option.classList.add(
                            "selected"
                        );


                        /*
                         * Update main image
                         */

                        mainMedicineImage.src =
                            option.dataset.image;

                    }
                );

            }
        );


        /* =========================================
           START DATE
        ========================================= */

        startDate.addEventListener(
            "change",
            () => {

                if (!startDate.value) {
                    return;
                }


                endDate.min =
                    startDate.value;


                if (
                    !endDate.value ||
                    endDate.value <
                    startDate.value
                ) {

                    endDate.value =
                        startDate.value;

                }


                hideMessages();

            }
        );


        /* =========================================
           END DATE
        ========================================= */

        endDate.addEventListener(
            "change",
            () => {

                if (
                    startDate.value &&
                    endDate.value <
                    startDate.value
                ) {

                    endDate.value =
                        startDate.value;

                }


                hideMessages();

            }
        );


        /* =========================================
           HIDE MESSAGES
        ========================================= */

        function hideMessages() {

            errorMessage.classList.remove(
                "show"
            );

            successMessage.classList.remove(
                "show"
            );
        }


        [
            medicineName,
            medicineNote
        ].forEach(
            input => {

                input.addEventListener(
                    "input",
                    hideMessages
                );

            }
        );


        /* =========================================
           SAVE
        ========================================= */

        saveMedicineBtn.addEventListener(
            "click",
            saveMedicine
        );


        function saveMedicine() {

            const name =
                medicineName.value.trim();

            const note =
                medicineNote.value.trim();

            const start =
                startDate.value;

            const end =
                endDate.value;


            /* =====================================
               GET TIMES
            ===================================== */

            const timeInputs =
                document.querySelectorAll(
                    ".medicine-time"
                );


            const times =
                Array.from(
                    timeInputs
                ).map(
                    input =>
                        input.value.trim()
                );


            /* =====================================
               REQUIRED FIELDS
            ===================================== */

            if (
                !name ||
                !start ||
                !end
            ) {

                errorMessage.textContent =
                    "Please fill in the medicine name and dates.";

                errorMessage.classList.add(
                    "show"
                );

                return;
            }


            /* =====================================
               TIME VALIDATION
            ===================================== */

            if (
                times.some(
                    time => !time
                )
            ) {

                errorMessage.textContent =
                    "Please enter a time for every dose.";

                errorMessage.classList.add(
                    "show"
                );

                return;
            }


            /* =====================================
               DATE VALIDATION
            ===================================== */

            if (end < start) {

                errorMessage.textContent =
                    "End date cannot be before the start date.";

                errorMessage.classList.add(
                    "show"
                );

                return;
            }


            /* =====================================
               SELECTED IMAGE
            ===================================== */

            const selectedOption =
                document.querySelector(
                    ".medicine-option.selected"
                );


            const image =
                selectedOption
                    ? selectedOption.dataset.image
                    : "med1.png";


            /* =====================================
               FREQUENCY
            ===================================== */

            const selectedFrequency =
                document.querySelector(
                    ".frequency-btn.selected"
                );


            const frequency =
                selectedFrequency
                    ? Number(
                        selectedFrequency.dataset.times
                    )
                    : 1;


            /* =====================================
               MEDICINE OBJECT
            ===================================== */

            const medicine = {

                id:
                    Date.now(),

                name:
                    name,

                note:
                    note,

                image:
                    image,

                startDate:
                    start,

                endDate:
                    end,

                frequency:
                    frequency,

                times:
                    times,

                createdAt:
                    new Date().toISOString()

            };


            /* =====================================
               EXISTING MEDICINES
            ===================================== */

            let medicines = [];


            try {

                medicines =
                    JSON.parse(
                        localStorage.getItem(
                            "medicines"
                        )
                    ) || [];

            } catch (error) {

                medicines = [];

            }


            /* =====================================
               ADD
            ===================================== */

            medicines.push(
                medicine
            );


            /* =====================================
               SAVE LOCAL STORAGE
            ===================================== */

            localStorage.setItem(
                "medicines",
                JSON.stringify(
                    medicines
                )
            );


            /* =====================================
               SUCCESS MESSAGE
            ===================================== */

            successMessage.textContent =
                `${name} has been added successfully.`;

            successMessage.classList.add(
                "show"
            );


            /* =====================================
               SUCCESS BUTTON
            ===================================== */

            saveMedicineBtn.innerHTML = `

                <span class="save-content">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <path
                            d="M20 6L9 17l-5-5">
                        </path>

                    </svg>

                    Medicine Added

                </span>

            `;


            saveMedicineBtn.style.background =
                "linear-gradient(135deg, #6c9bdf, #5275c7)";


            saveMedicineBtn.disabled =
                true;


            /* =====================================
               RETURN HOME
            ===================================== */

            setTimeout(
                () => {

                    window.location.href =
                        "index.html";

                },
                800
            );
        }


        /* =========================================
           BACK BUTTON
        ========================================= */

        function goBack() {

            if (
                document.referrer &&
                document.referrer !==
                window.location.href
            ) {

                history.back();

            } else {

                window.location.href =
                    "index.html";

            }
        }

    </script>

</body>

</html>
