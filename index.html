<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="manifest" href="manifest.json">

<link rel="icon"
    type="image/png"
    sizes="192x192"
    href="icon.png">

<link rel="apple-touch-icon"
    sizes="192x192"
    href="icon.png">

<meta name="theme-color" content="#4860b2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>MediMate</title>


<style>

/* =================================================
   GLOBAL
================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    min-height: 100%;

    overflow: hidden;
}

button {
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;

    user-select: none;
    -webkit-user-select: none;
}

button:focus,
button:focus-visible,
button:active {
    outline: none !important;
    box-shadow: none !important;
}


/* =================================================
   TOAST
================================================= */

#medimate-toast {
    position: fixed;

    top: 18px;
    left: 50%;

    transform:
        translate(-50%, -140px);

    width:
        calc(100% - 36px);

    max-width: 390px;

    min-height: 52px;

    padding:
        13px 17px;

    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    background: #263b71;
    color: white;

    border:
        1px solid
        rgba(255, 255, 255, 0.25);

    border-radius: 14px;

    box-shadow:
        0 10px 28px
        rgba(0, 0, 0, 0.45);

    font-family:
        "Segoe UI",
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    font-size: 13px;
    font-weight: 600;

    line-height: 1.4;

    z-index: 100000;

    opacity: 0;
    pointer-events: none;

    transition:
        transform 0.3s ease,
        opacity 0.3s ease;
}

#medimate-toast.show {
    transform:
        translate(-50%, 0);

    opacity: 1;
}

#medimate-toast.error {
    background: #9d3038;
}

#medimate-toast.success {
    background: #286b47;
}


/* =================================================
   SPLASH SCREEN
================================================= */

#splash-screen {
    position: fixed;
    inset: 0;

    z-index: 99999;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            rgba(35, 49, 105, 0.28),
            rgba(20, 29, 70, 0.42)
        ),
        url("bgmain.jpg");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    opacity: 1;
    visibility: visible;

    transition:
        opacity 0.7s ease,
        visibility 0.7s ease;
}

#splash-screen.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.splash-content {
    width: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    transform:
        translateY(-10px);

    animation:
        splashContent 1s ease forwards;
}

@keyframes splashContent {

    0% {
        opacity: 0;

        transform:
            translateY(15px)
            scale(0.94);
    }

    100% {
        opacity: 1;

        transform:
            translateY(-10px)
            scale(1);
    }
}

.splash-icon {
    width: 115px;
    height: 115px;

    display: block;

    object-fit: contain;

    border-radius: 14px;

    filter:
        drop-shadow(
            0 10px 25px
            rgba(0, 0, 0, 0.40)
        );

    animation:
        iconFloat 2.5s ease-in-out infinite;
}

@keyframes iconFloat {

    0%,
    100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-7px);
    }
}

.splash-title {
    margin-top: 18px;

    color: white;

    font-family:
        "Segoe UI",
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    font-size: 34px;
    font-weight: 700;

    letter-spacing: 1.5px;

    text-shadow:
        0 3px 15px
        rgba(0, 0, 0, 0.45);
}

.splash-subtitle {
    margin-top: 7px;

    color:
        rgba(255, 255, 255, 0.88);

    font-family:
        "Segoe UI",
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    font-size: 13px;
    font-style: italic;

    letter-spacing: 0.3px;

    text-shadow:
        0 2px 8px
        rgba(0, 0, 0, 0.4);
}

.splash-subtitle1 {
    margin-top: 9px;

    color:
        rgba(255, 255, 255, 0.68);

    font-family:
        "Segoe UI",
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    font-size: 11px;
    font-weight: 500;

    letter-spacing: 1.8px;

    text-transform: uppercase;

    text-shadow:
        0 2px 8px
        rgba(0, 0, 0, 0.4);

    opacity: 0.9;
}

.loading-dots {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 7px;

    margin-top: 27px;
}

.loading-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: white;

    opacity: 0.35;

    animation:
        loadingDot 1.2s infinite ease-in-out;
}

.loading-dot:nth-child(1) {
    animation-delay: 0s;
}

.loading-dot:nth-child(2) {
    animation-delay: 0.15s;
}

.loading-dot:nth-child(3) {
    animation-delay: 0.3s;
}

@keyframes loadingDot {

    0%,
    80%,
    100% {
        opacity: 0.3;
        transform: scale(0.8);
    }

    40% {
        opacity: 1;
        transform: scale(1);
    }
}


/* =================================================
   BODY
================================================= */

body {
    min-height: 100vh;
    min-height: 100dvh;

    height: 100vh;
    height: 100dvh;

    font-family: Arial, sans-serif;

    background-image:
        url("bgmain.jpg");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    background-attachment: fixed;

    overflow: hidden;
}


/* =================================================
   APP
================================================= */

.app {
    width: 100%;
    max-width: 430px;

    height: 100vh;
    height: 100dvh;

    min-height: 100vh;
    min-height: 100dvh;

    margin: 0 auto;

    overflow: hidden;

    display: flex;

    flex-direction: column;
}


/* =================================================
   HEADER
================================================= */

.header {
    padding:
        18px 20px 6px;

    flex-shrink: 0;
}

.top-row {
    display: flex;

    justify-content: space-between;
    align-items: center;
}

.date h1 {
    margin:
        0 0 0 -2px;

    font-size: 21px;

    color: #1f3eb8;

    font-family:
        "Segoe UI",
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    font-weight: 700;
}

.date p {
    margin:
        1px 0 0 -2px;

    color: #1f3eb8;

    font-size: 17px;

    font-style: italic;

    font-family:
        "Segoe UI",
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;
}


/* =================================================
   ACTION BUTTON
================================================= */

.action-buttons {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 8px;
}

.btn {
    position: relative;

    width: 38px;
    height: 38px;

    margin-top: -5px;

    padding: 0;

    border: none;

    border-radius: 50%;

    background:
        #4860b2;

    overflow: hidden;

    cursor: pointer;

    display: flex;

    align-items: center;
    justify-content: center;

    box-shadow:
        0 4px 10px
        rgba(0, 0, 0, 0.22);

    transition:
        transform 0.2s ease,
        background 0.2s ease;
}

.btn:hover {
    width: 38px;

    border-radius: 50%;

    transform:
        scale(1.05);

    background:
        #3f57a8;
}

.btn:active {
    transform:
        scale(0.95);
}

.add-icon::before,
.add-icon::after {
    content: "";

    position: absolute;

    width: 19px;
    height: 3px;

    background: white;

    border-radius: 3px;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);
}

.add-icon::after {
    transform:
        translate(-50%, -50%)
        rotate(90deg);
}

.btn-txt {
    display: none;
}


/* =================================================
   HEALTH QUOTE
================================================= */

.health-quote {
    width:
        calc(100% - 42px);

    min-height: 50px;

    margin:
        10px auto 0;

    padding:
        0 8px;

    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    color:
        rgba(39, 64, 206, 0.88);

    font-family:
        "Segoe UI",
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    font-size: 17px;

    font-style: italic;

    font-weight: 500;

    line-height: 1.35;

    text-shadow:
        0 2px 8px
        rgba(0, 0, 0, 0.15);

    transition:
        opacity 0.4s ease,
        transform 0.4s ease;

    flex-shrink: 0;
}

.health-quote.fade {
    opacity: 0;

    transform:
        translateY(4px);
}


/* =================================================
   MEDICINE INFORMATION CONTAINER
================================================= */

.medicine-info-container {
    width: 100%;

    flex: 1;

    min-height: 0;

    margin-top: 0;
    margin-bottom: 8px;

    padding:
        0 15px;

    overflow-y: auto;
    overflow-x: hidden;

    display: flex;

    flex-direction: column;

    gap: 10px;

    scroll-behavior: smooth;

    -webkit-overflow-scrolling: touch;
}

.medicine-info-container::-webkit-scrollbar {
    width: 4px;
}

.medicine-info-container::-webkit-scrollbar-track {
    background:
        rgba(255, 255, 255, 0.05);

    border-radius: 2px;
}

.medicine-info-container::-webkit-scrollbar-thumb {
    background:
        rgba(255, 255, 255, 0.20);

    border-radius: 2px;
}


/* =================================================
   MEDICINE CARD
================================================= */

.medicine-card {
    background:
        rgba(94, 119, 177, 0.55);

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);

    border:
        1px solid
        rgba(255, 255, 255, 0.18);

    border-radius: 30px;

    padding: 18px;

    flex-shrink: 0;

    animation:
        cardSlideIn 0.3s ease forwards;
}

@keyframes cardSlideIn {

    from {
        opacity: 0;

        transform:
            translateY(10px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0);
    }
}

.medicine-card-top {
    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 8px;
}

.medicine-card-image {
    width: 42px;
    height: 42px;

    flex:
        0 0 42px;

    object-fit: contain;

    background: transparent;

    border: 0;

    border-radius: 9px;

    display: block;

    filter:
        drop-shadow(
            0 5px 8px
            rgba(0, 0, 0, 0.18)
        );
}

.medicine-card-name {
    font-size: 18px;

    font-weight: 700;

    color:
        rgba(248, 241, 241, 0.94);

    margin-bottom: 8px;

    text-shadow:
        0 0 10px
        rgba(3, 8, 26, 0.956);
}

.medicine-card-times {
    font-size: 13px;

    color:
        rgba(255, 255, 255, 0.85);

    margin-bottom: 12px;

    line-height: 1.6;
}

.medicine-card-time {
    display: flex;

    align-items: center;

    gap: 8px;

    margin-bottom: 4px;
}

.medicine-card-time-dot {
    width: 5px;
    height: 5px;

    border-radius: 50%;

    background:
        rgba(255, 255, 255, 0.6);
}

.medicine-card-note {
    font-size: 11px;

    color:
        rgba(255, 255, 255, 0.65);

    margin-top: 10px;

    padding-top: 10px;

    border-top:
        1px solid
        rgba(255, 255, 255, 0.1);

    font-style: italic;
}

.medicine-card-actions {
    display: flex;

    gap: 12px;

    margin-top: 12px;

    padding-top: 12px;

    border-top:
        1px solid
        rgba(255, 255, 255, 0.1);
}

.medicine-card-action-btn {
    flex: 1;

    padding:
        12px;

    min-height: 44px;

    border-radius: 17px;

    border: none;

    font-size: 13px;

    font-weight: 700;

    cursor: pointer;

    transition:
        all 0.2s ease;

    color: white;
}

.medicine-card-action-btn.taken {
    background:
        rgba(67, 209, 122, 0.55);

    border:
        1px solid
        rgba(67, 209, 122, 0.8);
}

.medicine-card-action-btn.taken:hover {
    background:
        rgba(67, 209, 122, 0.7);
}

.medicine-card-action-btn.missed {
    background:
        rgba(255, 91, 103, 0.55);

    border:
        1px solid
        rgba(255, 91, 103, 0.8);
}

.medicine-card-action-btn.missed:hover {
    background:
        rgba(255, 91, 103, 0.7);
}


/* =================================================
   EMPTY HOME STATE
================================================= */

.medicine-home-empty {
    width: 100%;

    flex: 1;

    min-height: 0;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding:
        0 15px 4px;

    animation:
        emptyStateIn 0.35s ease forwards;
}

@keyframes emptyStateIn {

    from {
        opacity: 0;

        transform:
            translateY(10px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0);
    }
}

.pill-note-wrapper {
    position: relative;

    width: 100%;

    height: 300px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: flex-start;

    margin-bottom: 0;
}

.medicine-info-note {
    position: relative;

    width: 260px;

    min-height: 53px;

    padding:
        10px 14px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 9px;

    margin-bottom: 5px;

    border:
        1px solid
        rgba(255, 255, 255, 0.30);

    border-radius: 16px;

    background:
        rgba(82, 103, 154, 0.60);

    backdrop-filter:
        blur(14px);

    -webkit-backdrop-filter:
        blur(14px);

    box-shadow:
        0 8px 22px
        rgba(0, 0, 0, 0.28),

        inset 0 1px 0
        rgba(255, 255, 255, 0.16);

    color:
        rgba(255, 255, 255, 0.94);

    font-family:
        "Segoe UI",
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    font-size: 11px;

    font-weight: 500;

    line-height: 1.4;

    text-align: center;

    z-index: 5;

    pointer-events: none;

    animation:
        noteFloat 3s ease-in-out infinite;
}

.medicine-info-note::after {
    content: "";

    position: absolute;

    bottom: -5px;

    left: 50%;

    width: 9px;
    height: 9px;

    transform:
        translateX(-50%)
        rotate(45deg);

    background:
        rgba(82, 103, 154, 0.60);

    border-right:
        1px solid
        rgba(255, 255, 255, 0.20);

    border-bottom:
        1px solid
        rgba(255, 255, 255, 0.20);

    z-index: -1;
}

.medicine-info-note-icon {
    width: 21px;
    height: 21px;

    min-width: 21px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        rgba(255, 255, 255, 0.15);

    font-size: 11px;

    box-shadow:
        inset 0 0 8px
        rgba(255, 255, 255, 0.08);
}

@keyframes noteFloat {

    0%,
    100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-3px);
    }
}

.medicine-home-empty img {
    width: 190px;
    height: 190px;

    max-width: 66vw;
    max-height: 190px;

    object-fit: contain;

    display: block;

    margin: 45px 0 0;

    filter:
        drop-shadow(
            0 12px 22px
            rgba(0, 0, 0, 0.40)
        );

    transition:
        transform 0.25s ease,
        filter 0.25s ease;
}

.medicine-home-empty img:hover {
    transform:
        scale(1.04)
        translateY(-3px);

    filter:
        drop-shadow(
            0 16px 28px
            rgba(0, 0, 0, 0.48)
        );
}

.empty-add-medicine-btn {
    min-width: 228px;

    height: 60px;

    padding:
        0 28px;

    border:
        1px solid
        rgba(21, 17, 17, 0.494);

    border-radius: 20px;

    background:
        rgba(104, 132, 198, 0.68);

    color: white;

    font-family:
        "Segoe UI",
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    font-size: 16px;

    font-weight: 700;

    letter-spacing: 0.2px;

    cursor: pointer;

    box-shadow:
        0 6px 16px
        rgba(0, 0, 0, 0.45);

    transition:
        transform 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
}

.empty-add-medicine-btn:hover {
    transform:
        translateY(-2px)
        scale(1.02);

    color:
        #4a65d2;

    text-shadow:
        0 0 1px #00040b;

    background:
        rgba(162, 186, 246, 0.84);

    box-shadow:
        0 10px 22px
        rgba(0, 0, 0, 0.40);
}

.empty-add-medicine-btn:active {
    transform:
        translateY(0)
        scale(0.98);
}

.medicine-empty-state {
    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    flex: 1;

    text-align: center;

    color:
        rgba(255, 255, 255, 0.6);

    font-size: 20px;

    line-height: 1.6;

    min-height: 180px;
}

.medicine-empty-icon {
    font-size: 102px;

    margin-bottom: 12px;
}


/* =================================================
   STATUS SECTION
================================================= */

.medicine-status {
    width:
        calc(100% - 28px);

    display: flex;

    flex-direction: column;

    gap: 14px;

    margin:
        0 auto 14px;

    flex-shrink: 0;
}

.status-button {
    width: 100%;

    height: 66px;

    padding:
        0 21px;

    border:
        1px solid
        rgba(255, 255, 255, 0.28);

    border-radius: 22px;

    background:
        rgba(105, 121, 160, 0.56);

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);

    box-shadow:
        0 6px 18px
        rgba(2, 16, 42, 0.40);

    display: flex;

    align-items: center;

    cursor: pointer;

    margin-bottom: 0;

    color:
        rgb(241, 243, 246);

    font-weight: 700;

    text-shadow:
        0 0 10px
        rgba(0, 0, 0, 0.45);

    font-family:
        "Segoe UI",
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    transition:
        transform 0.18s ease,
        background-color 0.18s ease,
        box-shadow 0.18s ease,
        border-color 0.18s ease;

    flex-shrink: 0;
}

.status-button:hover {
    transform:
        translateY(-2px);

    background:
        rgba(108, 123, 161, 0.68);

    box-shadow:
        0 8px 20px
        rgba(0, 0, 0, 0.30);

    border-color:
        rgba(255, 255, 255, 0.34);
}

.status-button:active {
    transform:
        translateY(0);
}

.status-button.active {
    border-color:
        rgba(255, 255, 255, 0.50);

    background:
        rgba(20, 39, 87, 0.48);

    box-shadow:
        0 0 18px
        rgba(72, 96, 178, 0.35);
}

.status-indicator {
    width: 17px;
    height: 17px;

    min-width: 17px;

    border-radius: 50%;

    margin-right: 18px;

    box-shadow:
        0 0 10px
        currentColor;
}

.upcoming .status-indicator {
    background:
        #4f8cff;

    color:
        #4f8cff;
}

.medicine .status-indicator {
    background:
        #43d17a;

    color:
        #43d17a;
}

.missed .status-indicator {
    background:
        #ff5b67;

    color:
        #ff5b67;
}

.status-name {
    font-size: 19px;

    text-shadow:
        0 0 10px
        rgba(0, 0, 0, 0.55);

    font-weight: 700;

    letter-spacing: 0.2px;

    white-space: nowrap;
}

.status-description {
    margin-left: 9px;

    font-size: 12.5px;

    color:
        rgba(255, 255, 255, 0.60);

    white-space: nowrap;

    font-weight: 600;
}

.status-count {
    margin-left: auto;

    min-width: 42px;

    height: 42px;

    padding:
        0 10px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 13px;

    background:
        rgba(255, 255, 255, 0.10);

    font-size: 16px;

    font-weight: 700;

    color: white;

    flex-shrink: 0;
}

.upcoming .status-count {
    color:
        #94b8fb;

    background:
        rgba(12, 29, 61, 0.40);
}

.medicine .status-count {
    color:
        #89f3b1;

    background:
        rgba(21, 68, 39, 0.40);
}

.missed .status-count {
    color:
        #fc959b;

    background:
        rgba(80, 28, 31, 0.40);
}


/* =================================================
   MOBILE
================================================= */

@media (max-width: 430px) {

    html,
    body {
        width: 100%;
        height: 100%;

        min-height: 100%;

        overflow: hidden;

<script>


/* =================================================
   TOAST
================================================= */

let toastTimer = null;

function showMessage(
    message,
    type = "error",
    duration = 3500
) {

    const toast =
        document.getElementById(
            "medimate-toast"
        );

    if (!toast) {
        return;
    }

    clearTimeout(toastTimer);

    toast.textContent =
        message;

    toast.className = "";

    toast.classList.add(
        "show",
        type
    );

    toastTimer =
        setTimeout(
            function () {

                toast.classList.remove(
                    "show"
                );

            },
            duration
        );
}


/* =================================================
   SPLASH
================================================= */

const splashScreen =
    document.getElementById(
        "splash-screen"
    );

const splashAlreadyShown =
    sessionStorage.getItem(
        "medimateSplashShown"
    );

if (
    splashAlreadyShown === "true"
) {

    splashScreen.remove();

} else {

    sessionStorage.setItem(
        "medimateSplashShown",
        "true"
    );

    setTimeout(
        function () {

            splashScreen.classList.add(
                "hide"
            );

            setTimeout(
                function () {

                    if (splashScreen) {

                        splashScreen.remove();

                    }

                },
                700
            );

        },
        4000
    );
}


/* =================================================
   OPEN ADD MEDICINE
================================================= */

function openAddMedicine() {

    window.location.href =
        "addmed.html";
}


/* =================================================
   TIME VALIDATION
================================================= */

function isValidTimeFormat(time) {

    if (
        typeof time !== "string"
    ) {

        return false;
    }

    const value =
        time.trim();

    if (
        !/^\d{2}:\d{2}$/.test(value)
    ) {

        return false;
    }

    const parts =
        value.split(":");

    const hours =
        Number(parts[0]);

    const minutes =
        Number(parts[1]);

    return (
        hours >= 0 &&
        hours <= 23 &&
        minutes >= 0 &&
        minutes <= 59
    );
}


function normalizeTime(value) {

    if (
        typeof value !== "string"
    ) {

        return null;
    }

    const time =
        value.trim();

    if (isValidTimeFormat(time)) {

        return time;
    }

    const match =
        time.match(
            /^(1[0-2]|[1-9]):([0-5][0-9])\s*(AM|PM)$/i
        );

    if (!match) {

        return null;
    }

    let hours =
        Number(match[1]);

    const minutes =
        match[2];

    const period =
        match[3].toUpperCase();

    if (period === "AM") {

        hours =
            hours === 12
                ? 0
                : hours;

    } else {

        hours =
            hours === 12
                ? 12
                : hours + 12;
    }

    return `${String(hours).padStart(2, "0")}:${minutes}`;
}


function convertTo12Hour(timeStr) {

    if (
        !isValidTimeFormat(timeStr)
    ) {

        return "--:--";
    }

    const parts =
        timeStr
            .split(":")
            .map(Number);

    const hours =
        parts[0];

    const minutes =
        parts[1];

    const period =
        hours >= 12
            ? "PM"
            : "AM";

    const displayHours =
        hours % 12 || 12;

    return `${displayHours}:${String(minutes).padStart(2, "0")} ${period}`;
}


/* =================================================
   DATE HELPERS
================================================= */

function formatDateToString(date) {

    const year =
        date.getFullYear();

    const month =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            date.getDate()
        ).padStart(2, "0");

    return `${year}-${month}-${day}`;
}


function isValidDateString(dateStr) {

    if (
        typeof dateStr !== "string"
    ) {

        return false;
    }

    if (
        !/^\d{4}-\d{2}-\d{2}$/.test(
            dateStr
        )
    ) {

        return false;
    }

    const parts =
        dateStr
            .split("-")
            .map(Number);

    const date =
        new Date(
            parts[0],
            parts[1] - 1,
            parts[2]
        );

    return (
        date.getFullYear() === parts[0] &&
        date.getMonth() === parts[1] - 1 &&
        date.getDate() === parts[2]
    );
}


function parseDateString(dateStr) {

    if (
        !isValidDateString(dateStr)
    ) {

        return new Date();
    }

    const parts =
        dateStr
            .split("-")
            .map(Number);

    return new Date(
        parts[0],
        parts[1] - 1,
        parts[2]
    );
}


/* =================================================
   TIME PASSED
================================================= */

function hasTimePassedToday(
    timeStr,
    selectedDate
) {

    if (
        !isValidTimeFormat(timeStr)
    ) {

        return false;
    }

    const now =
        new Date();

    const selectedDateObj =
        typeof selectedDate === "string"
            ? parseDateString(selectedDate)
            : selectedDate;

    const todayStr =
        formatDateToString(now);

    const selectedDateStr =
        formatDateToString(
            selectedDateObj
        );

    if (
        todayStr !== selectedDateStr
    ) {

        return (
            todayStr >
            selectedDateStr
        );
    }

    const parts =
        timeStr
            .split(":")
            .map(Number);

    const medicineMinutes =
        parts[0] * 60 +
        parts[1];

    const nowMinutes =
        now.getHours() * 60 +
        now.getMinutes();

    return (
        nowMinutes >= medicineMinutes
    );
}


/* =================================================
   NORMALIZE MEDICINE
================================================= */

function normalizeMedicine(
    medicine,
    index
) {

    if (
        !medicine ||
        typeof medicine !== "object"
    ) {

        return null;
    }

    const name =
        medicine.name ||
        medicine.medicineName ||
        medicine.medicine ||
        "Medicine";

    const person =
        medicine.person ||
        medicine.personName ||
        medicine.forPerson ||
        "User";

    const id =
        medicine.id !== undefined &&
        medicine.id !== null
            ? String(medicine.id)
            : `medicine-${index}-${Date.now()}`;

    const startDate =
        medicine.startDate ||
        medicine.start ||
        medicine.start_date ||
        medicine.fromDate;

    const endDate =
        medicine.endDate ||
        medicine.end ||
        medicine.end_date ||
        medicine.toDate;

    if (
        !isValidDateString(startDate) ||
        !isValidDateString(endDate)
    ) {

        return null;
    }


    let rawTimes = [];


    if (
        Array.isArray(medicine.times)
    ) {

        rawTimes =
            medicine.times;

    } else if (
        Array.isArray(medicine.timeSlots)
    ) {

        rawTimes =
            medicine.timeSlots;

    } else if (
        Array.isArray(medicine.scheduledTimes)
    ) {

        rawTimes =
            medicine.scheduledTimes;

    } else if (
        Array.isArray(medicine.doses)
    ) {

        rawTimes =
            medicine.doses;

    } else if (
        typeof medicine.time === "string"
    ) {

        rawTimes = [
            medicine.time
        ];

    } else if (
        typeof medicine.times === "string"
    ) {

        rawTimes = [
            medicine.times
        ];
    }


    const normalizedTimes = [];


    rawTimes.forEach(
        function(timeItem) {

            let timeValue = null;

            if (
                typeof timeItem === "string"
            ) {

                timeValue =
                    timeItem;

            } else if (
                timeItem &&
                typeof timeItem === "object"
            ) {

                timeValue =
                    timeItem.time ||
                    timeItem.value ||
                    timeItem.timeValue;
            }

            const validTime =
                normalizeTime(
                    timeValue
                );

            if (validTime) {

                normalizedTimes.push({
                    time: validTime
                });
            }

        }
    );


    if (
        normalizedTimes.length === 0
    ) {

        return null;
    }


    return {

        ...medicine,

        id: id,

        name: name,

        person: person,

        startDate: startDate,

        endDate: endDate,

        times: normalizedTimes,

        note:
            medicine.note ||
            medicine.notes ||
            "",

        image:
            medicine.image ||
            medicine.medicineImage ||
            "med1.png"
    };
}


/* =================================================
   LOAD MEDICINES
================================================= */

function loadMedicines() {

    try {

        const stored =
            localStorage.getItem(
                "medicines"
            );

        if (!stored) {

            return [];
        }

        const parsed =
            JSON.parse(stored);

        if (
            !Array.isArray(parsed)
        ) {

            return [];
        }

        return parsed
            .map(
                function(
                    medicine,
                    index
                ) {

                    return normalizeMedicine(
                        medicine,
                        index
                    );

                }
            )
            .filter(Boolean);

    } catch (error) {

        console.error(
            "Error loading medicines:",
            error
        );

        return [];
    }
}


/* =================================================
   DOSE STATUS
================================================= */

function loadDoseStatuses() {

    try {

        const stored =
            localStorage.getItem(
                "doseStatuses"
            );

        return stored
            ? JSON.parse(stored)
            : {};

    } catch (error) {

        console.error(
            "Error loading dose statuses:",
            error
        );

        return {};
    }
}


function saveDoseStatus(
    medicineId,
    date,
    time,
    status
) {

    const statuses =
        loadDoseStatuses();

    const key =
        `${medicineId}-${date}`;

    if (!statuses[key]) {

        statuses[key] = {};
    }

    statuses[key][time] =
        status;

    try {

        localStorage.setItem(
            "doseStatuses",
            JSON.stringify(statuses)
        );

    } catch (error) {

        console.error(
            "Error saving dose status:",
            error
        );
    }
}


function getDoseStatus(
    medicineId,
    date,
    time
) {

    const statuses =
        loadDoseStatuses();

    const key =
        `${medicineId}-${date}`;

    if (
        statuses[key] &&
        statuses[key][time]
    ) {

        return statuses[key][time];
    }

    return "pending";
}


function removeDoseFromTaken(
    medicineId,
    date,
    time
) {

    const statuses =
        loadDoseStatuses();

    const key =
        `${medicineId}-${date}`;

    if (
        statuses[key] &&
        statuses[key][time] === "taken"
    ) {

        delete statuses[key][time];

        if (
            Object.keys(
                statuses[key]
            ).length === 0
        ) {

            delete statuses[key];
        }

        try {

            localStorage.setItem(
                "doseStatuses",
                JSON.stringify(statuses)
            );

        } catch (error) {

            console.error(
                "Error removing dose status:",
                error
            );
        }
    }

    updateMedicineDisplay();
}


/* =================================================
   DATE / TAB
================================================= */

let selectedDate =
    new Date();

selectedDate.setHours(
    0,
    0,
    0,
    0
);

let selectedStatusTab =
    "upcoming";


function updateDateDisplay() {

    const dateText =
        selectedDate.toLocaleDateString(
            "en-IN",
            {
                day: "numeric",
                month: "long",
                year: "numeric"
            }
        );

    document.getElementById(
        "current-date"
    ).textContent =
        dateText;
}


/* =================================================
   APPLICABLE MEDICINES
================================================= */

function getApplicableMedicines(
    date
) {

    const medicines =
        loadMedicines();

    const dateStr =
        formatDateToString(date);

    return medicines.filter(
        medicine => {

            return (
                dateStr >= medicine.startDate &&
                dateStr <= medicine.endDate
            );

        }
    );
}


/* =================================================
   DOSE CATEGORIES
================================================= */

function getDoseCategories(
    date
) {

    const medicines =
        getApplicableMedicines(date);

    const dateStr =
        formatDateToString(date);

    const upcoming = [];
    const taken = [];
    const missed = [];


    medicines.forEach(
        medicine => {

            if (
                !Array.isArray(
                    medicine.times
                )
            ) {

                return;
            }


            medicine.times.forEach(
                timeObj => {

                    if (
                        !timeObj ||
                        !timeObj.time
                    ) {

                        return;
                    }

                    const validTime =
                        normalizeTime(
                            timeObj.time
                        );

                    if (!validTime) {

                        return;
                    }


                    const status =
                        getDoseStatus(
                            medicine.id,
                            dateStr,
                            validTime
                        );


                    const doseInfo = {

                        medicineId:
                            medicine.id,

                        medicineName:
                            medicine.name,

                        person:
                            medicine.person,

                        time:
                            validTime,

                        note:
                            medicine.note ||
                            "",

                        image:
                            medicine.image ||
                            "med1.png",

                        status:
                            status
                    };


                    if (
                        status === "taken"
                    ) {

                        taken.push(
                            doseInfo
                        );

                    } else if (
                        status === "missed"
                    ) {

                        missed.push(
                            doseInfo
                        );

                    } else if (
                        status === "skipped"
                    ) {

                        return;

                    } else {

                        if (
                            hasTimePassedToday(
                                validTime,
                                date
                            )
                        ) {

                            missed.push({
                                ...doseInfo,
                                status: "missed"
                            });

                        } else {

                            upcoming.push(
                                doseInfo
                            );
                        }
                    }

                }
            );

        }
    );


    const sortByTime =
        (a, b) => {

            const aParts =
                a.time
                    .split(":")
                    .map(Number);

            const bParts =
                b.time
                    .split(":")
                    .map(Number);

            return (
                (
                    aParts[0] * 60 +
                    aParts[1]
                ) -
                (
                    bParts[0] * 60 +
                    bParts[1]
                )
            );
        };


    upcoming.sort(sortByTime);

    taken.sort(sortByTime);

    missed.sort(sortByTime);


    return {
        upcoming,
        taken,
        missed
    };
}


/* =================================================
   UPDATE DISPLAY
================================================= */

function updateMedicineDisplay() {

    updateDateDisplay();

    const categories =
        getDoseCategories(
            selectedDate
        );

    document.getElementById(
        "upcoming-count"
    ).textContent =
        categories.upcoming.length;

    document.getElementById(
        "medicine-count"
    ).textContent =
        categories.taken.length;

    document.getElementById(
        "missed-count"
    ).textContent =
        categories.missed.length;

    updateActiveStatusButton();

    renderMedicineCards();
}


/* =================================================
   ACTIVE STATUS
================================================= */

function updateActiveStatusButton() {

    document
        .querySelectorAll(
            ".status-button"
        )
        .forEach(
            button => {

                button.classList.remove(
                    "active"
                );

            }
        );


    if (
        selectedStatusTab === "upcoming"
    ) {

        document
            .getElementById(
                "upcoming-status"
            )
            .classList.add(
                "active"
            );

    } else if (
        selectedStatusTab === "taken"
    ) {

        document
            .getElementById(
                "taken-status"
            )
            .classList.add(
                "active"
            );

    } else {

        document
            .getElementById(
                "missed-status"
            )
            .classList.add(
                "active"
            );
    }
}


/* =================================================
   STATUS TAB EVENTS
================================================= */

document
    .getElementById(
        "upcoming-status"
    )
    .addEventListener(
        "click",
        function() {

            selectedStatusTab =
                "upcoming";

/* =================================================
   RENDER MEDICINE CARDS
================================================= */

function renderMedicineCards() {

    const container =
        document.getElementById(
            "medicineInfoContainer"
        );

    const categories =
        getDoseCategories(
            selectedDate
        );

    let dosesToShow = [];


    if (
        selectedStatusTab === "upcoming"
    ) {

        dosesToShow =
            categories.upcoming;

    } else if (
        selectedStatusTab === "taken"
    ) {

        dosesToShow =
            categories.taken;

    } else {

        dosesToShow =
            categories.missed;
    }


    container.innerHTML = "";


    /* =================================================
       EMPTY UPCOMING
    ================================================= */

    if (
        dosesToShow.length === 0 &&
        selectedStatusTab === "upcoming"
    ) {

        const emptyState =
            document.createElement(
                "div"
            );

        emptyState.className =
            "medicine-home-empty";

        emptyState.innerHTML = `

            <div class="pill-note-wrapper">

                <div class="medicine-info-note">

                    <span class="medicine-info-note-icon">
                        💊
                    </span>

                    <span>
                        Track your pills throughout the day !!!
                    </span>

                </div>

                <img
                    src="pillicon.png"
                    alt="Medicine"
                >

            </div>


            <button
                class="empty-add-medicine-btn"
                type="button"
                onclick="openAddMedicine()">

                + Add Medicine

            </button>

        `;

        container.appendChild(
            emptyState
        );

        return;
    }


    /* =================================================
       NO TAKEN / MISSED
    ================================================= */

    if (
        dosesToShow.length === 0
    ) {

        const emptyState =
            document.createElement(
                "div"
            );

        emptyState.className =
            "medicine-empty-state";

        let message =
            "Nothing here yet.";


        if (
            selectedStatusTab === "taken"
        ) {

            message =
                "No medicines taken today.";

        } else if (
            selectedStatusTab === "missed"
        ) {

            message =
                "No medicines missed.";
        }


        emptyState.innerHTML = `

            <div
                class="medicine-empty-icon">

                💊

            </div>

            <div>
                ${message}
            </div>

        `;

        container.appendChild(
            emptyState
        );

        return;
    }


    /* =================================================
       MEDICINE CARDS
    ================================================= */

    dosesToShow.forEach(
        dose => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "medicine-card";


            const displayTime =
                convertTo12Hour(
                    dose.time
                );


            let statusIcon =
                "🔵";

            let statusText =
                "Pending";


            if (
                dose.status === "taken"
            ) {

                statusIcon =
                    "✅";

                statusText =
                    "Taken";

            } else if (
                dose.status === "missed"
            ) {

                statusIcon =
                    "❌";

                statusText =
                    "Missed";
            }


            let actionButtons = "";


            if (
                selectedStatusTab === "upcoming"
            ) {

                actionButtons = `

                    <button
                        class="medicine-card-action-btn taken"
                        onclick="quickMarkDose(
                            '${escapeJs(dose.medicineId)}',
                            '${escapeJs(formatDateToString(selectedDate))}',
                            '${escapeJs(dose.time)}',
                            'taken'
                        )">

                        ✓ Taken

                    </button>


                    <button
                        class="medicine-card-action-btn missed"
                        onclick="quickMarkDose(
                            '${escapeJs(dose.medicineId)}',
                            '${escapeJs(formatDateToString(selectedDate))}',
                            '${escapeJs(dose.time)}',
                            'missed'
                        )">

                        ✕ Missed

                    </button>

                `;

            } else if (
                selectedStatusTab === "taken"
            ) {

                actionButtons = `

                    <button
                        class="medicine-card-action-btn missed"
                        onclick="removeDoseFromTaken(
                            '${escapeJs(dose.medicineId)}',
                            '${escapeJs(formatDateToString(selectedDate))}',
                            '${escapeJs(dose.time)}'
                        )">

                        ↩ Remove from Taken

                    </button>

                `;

            } else if (
                selectedStatusTab === "missed"
            ) {

                actionButtons = `

                    <button
                        class="medicine-card-action-btn taken"
                        onclick="quickMarkDose(
                            '${escapeJs(dose.medicineId)}',
                            '${escapeJs(formatDateToString(selectedDate))}',
                            '${escapeJs(dose.time)}',
                            'taken'
                        )">

                        ✓ Mark Taken

                    </button>

                `;
            }


            card.innerHTML = `

                <div class="medicine-card-top">

                    <img
                        class="medicine-card-image"
                        src="${escapeHtml(
                            dose.image ||
                            "med1.png"
                        )}"
                        alt="Medicine form"
                        draggable="false"
                        onerror="this.style.display='none';">


                    <div
                        class="medicine-card-name">

                        ${escapeHtml(
                            dose.medicineName ||
                            "Medicine"
                        )}

                    </div>

                </div>


                <div
                    class="medicine-card-times">

                    <div
                        class="medicine-card-time">

                        <div
                            class="medicine-card-time-dot">
                        </div>

                        <span>
                            ${displayTime}
                        </span>

                        <span
                            style="
                                margin-left:auto;
                                font-size:12px;
                            ">

                            ${statusIcon}
                            ${statusText}

                        </span>

                    </div>

                </div>


                ${
                    dose.note
                        ? `

                            <div
                                class="medicine-card-note">

                                Note:
                                ${escapeHtml(
                                    dose.note
                                )}

                            </div>

                        `
                        : ""
                }


                ${
                    actionButtons
                        ? `

                            <div
                                class="medicine-card-actions">

                                ${actionButtons}

                            </div>

                        `
                        : ""
                }

            `;


            container.appendChild(
                card
            );

        }
    );
}

/* =================================================
   ESCAPE HTML
================================================= */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";
    }

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


function escapeJs(value) {

    return String(
        value ?? ""
    )

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        )

        .replace(
            /"/g,
            '\\"'
        )

        .replace(
            /\n/g,
            "\\n"
        )

        .replace(
            /\r/g,
            "\\r"
        );
}

/* =================================================
   SERVICE WORKER + NOTIFICATIONS
================================================= */

let medimateRegistration = null;


async function registerMediMateServiceWorker() {

    if (
        !("serviceWorker" in navigator)
    ) {

        console.error(
            "Service workers are not supported."
        );

        return null;
    }


    try {

        medimateRegistration =
            await navigator.serviceWorker.register(
                "./sw.js"
            );

        await navigator.serviceWorker.ready;

        console.log(
            "MediMate service worker registered."
        );

        return medimateRegistration;

    } catch (error) {

        console.error(
            "Service worker registration failed:",
            error
        );

        return null;
    }
}


/* =================================================
   NOTIFICATION PERMISSION
================================================= */

async function requestNotificationPermission() {

    if (
        !("Notification" in window)
    ) {

        console.error(
            "Notifications are not supported."
        );

        return false;
    }


    if (
        Notification.permission === "granted"
    ) {

        return true;
    }


    if (
        Notification.permission === "denied"
    ) {

        console.warn(
            "Notification permission was denied."
        );

        return false;
    }


    const permission =
        await Notification.requestPermission();

    return permission === "granted";
}


/* =================================================
   SHOW MEDICINE NOTIFICATION
================================================= */

async function showMedicineNotification(
    medicineName,
    person,
    time
) {

    const allowed =
        await requestNotificationPermission();

    if (!allowed) {

        return;
    }


    const registration =
        medimateRegistration ||
        await navigator.serviceWorker.ready;

    if (!registration) {

        return;
    }


    registration.showNotification(
        "💊 MediMate Reminder",
        {

            body:
                `${medicineName} is due now`,

            icon:
                "./icon.png",

            badge:
                "./icon.png",

            tag:
                `med-${medicineName}-${time}`,

            renotify:
                true,

            requireInteraction:
                true,

            vibrate: [
                300,
                150,
                300,
                150,
                500
            ],

            data: {

                medicineName:
                    medicineName,

                person:
                    person,

                time:
                    time
            }

        }
    );
}


/* =================================================

/* =================================================

================================================= */

document.addEventListener(

/* =================================================
   MEDICINE ALARM CHECKER
================================================= */

const triggeredMedicineAlarms = {};


function checkMedicineAlarms() {

    const now =
        new Date();

    const today =
        formatDateToString(now);

    const currentHours =
        now.getHours();

    const currentMinutes =
        now.getMinutes();

    const currentTime =
        `${String(currentHours).padStart(2, "0")}:${String(currentMinutes).padStart(2, "0")}`;


    const medicines =
        getApplicableMedicines(now);


    medicines.forEach(
        function(medicine) {

            if (
                !Array.isArray(
                    medicine.times
                )
            ) {

                return;
            }


            medicine.times.forEach(
                function(timeObj) {

                    if (
                        !timeObj ||
                        !timeObj.time
                    ) {

                        return;
                    }


                    const medicineTime =
                        normalizeTime(
                            timeObj.time
                        );

                    if (!medicineTime) {

                        return;
                    }


                    if (
                        medicineTime !==
                        currentTime
                    ) {

                        return;
                    }


                    const alarmKey =
                        `${medicine.id}-${today}-${medicineTime}`;


                    if (
                        triggeredMedicineAlarms[
                            alarmKey
                        ]
                    ) {

                        return;
                    }


                    const status =
                        getDoseStatus(
                            medicine.id,
                            today,
                            medicineTime
                        );


                    if (
                        status === "taken" ||
                        status === "missed" ||
                        status === "skipped"
                    ) {

                        return;
                    }


                    triggeredMedicineAlarms[
                        alarmKey
                    ] = true;


                    showMedicineNotification(
                        medicine.name,
                        medicine.person,
                        medicineTime
                    );


                    playMedicineAlarm();

                }
            );

        }
    );
}


/* =================================================
   ALARM SOUND
================================================= */

let medicineAlarmAudio = null;


function playMedicineAlarm() {

    try {

        if (!medicineAlarmAudio) {

            medicineAlarmAudio =
                new Audio(
                    "./alarm.mp3"
                );

            medicineAlarmAudio.loop =
                true;

            medicineAlarmAudio.volume =
                1.0;
        }


        medicineAlarmAudio.currentTime =
            0;


        const playPromise =
            medicineAlarmAudio.play();


        if (playPromise) {

            playPromise.catch(
                function(error) {

                    console.warn(
                        "Alarm sound could not autoplay:",
                        error
                    );

                }
            );
        }


        setTimeout(
            function() {

                stopMedicineAlarm();

            },
            30000
        );

    } catch (error) {

        console.error(
            "Alarm error:",
            error
        );
    }
}


function stopMedicineAlarm() {

    if (
        !medicineAlarmAudio
    ) {

        return;
    }

    medicineAlarmAudio.pause();

    medicineAlarmAudio.currentTime =
        0;
}


/* =================================================
   CHECK IMMEDIATELY
================================================= */

checkMedicineAlarms();


/* =================================================
   CHECK EVERY 10 SECONDS
================================================= */

setInterval(
    checkMedicineAlarms,
    10000
);
